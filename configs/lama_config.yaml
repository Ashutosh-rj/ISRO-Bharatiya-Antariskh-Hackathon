# LaMa Model Configuration
model:
  name: "LaMa_Big"
  in_channels: 4  # G-R-NIR + Mask
  out_channels: 3 # Reconstructed G-R-NIR
  
training:
  batch_size: 4
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.00001
  
  losses:
    l1_weight: 10.0
    perceptual_weight: 1.0
    fft_weight: 1.0

inference:
  use_onnx: true
  onnx_path: "models/lama/weights/lama.onnx"
  pytorch_path: "models/lama/weights/lama_big.pth"
  batch_size: 1
  pad_to_multiple: 8
